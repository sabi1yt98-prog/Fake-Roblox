
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockPlay - Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111216;color:white;
font-family:Arial,sans-serif}
header{background:#202127;padding:15px;
display:flex;align-items:center;gap:14px;
position:sticky;top:0;z-index:2}
.logo{font-size:24px;font-weight:900;color:#ff424f}
input{width:100%;padding:12px;border:0;
border-radius:8px;background:#303138;color:white}
nav{display:flex;gap:9px;padding:12px;
overflow-x:auto;background:#1b1c21}
nav button{white-space:nowrap}
button{border:0;border-radius:7px;padding:10px 15px;
background:#ff424f;color:white;font-weight:bold;
cursor:pointer}
button:active{transform:scale(.97)}
main{padding:18px;max-width:1100px;margin:auto}
h1{font-size:26px}
.muted{color:#a7a7b3}
.grid{display:grid;grid-template-columns:
repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#202127;border-radius:12px;
overflow:hidden;min-width:0}
.thumb{height:115px;display:grid;place-items:center;
font-size:53px;background:linear-gradient(135deg,#373c55,#202127)}
.info{padding:11px}
.info h3{margin:0 0 7px;font-size:16px}
.info p{font-size:12px;color:#b4b4c0}
.play{width:100%}
footer{text-align:center;padding:25px;color:#999;
font-size:12px}
#message{margin-top:18px;color:#ff9da4}
</style>
</head>
<body>
<header>
  <div class="logo">BLOX</div>
  <input id="search" placeholder="Search games..."
  aria-label="Search games">
</header>
<nav>
  <button onclick="filterGames('All')">Home</button>
  <button onclick="filterGames('Adventure')">Adventure</button>
  <button onclick="filterGames('Obby')">Obby</button>
  <button onclick="filterGames('Simulator')">Simulator</button>
</nav>
<main>
  <h1>Discover</h1>
  <p class="muted">Find your next favorite game!</p>
  <h2>Popular experiences</h2>
  <div class="grid" id="games"></div>
  <p id="message" role="status"></p>
</main>
<footer>
  BlockPlay is an independent fan-made demo.
  Not affiliated with or endorsed by Roblox.
</footer>
<script>
const data=[
 {name:"Escape the Tsunami",cat:"Adventure",emoji:"🌊",players:"Adventure"},
 {name:"Mega Obby",cat:"Obby",emoji:"🏃",players:"Parkour"},
 {name:"Pet World",cat:"Simulator",emoji:"🐾",players:"Pets"},
 {name:"City Life",cat:"Adventure",emoji:"🏙️",players:"Roleplay"},
 {name:"Speed Legends",cat:"Simulator",emoji:"⚡",players:"Racing"},
 {name:"Tower Challenge",cat:"Obby",emoji:"🗼",players:"Jump & climb"},
 {name:"Build a Kingdom",cat:"Simulator",emoji:"🏰",players:"Building"},
 {name:"Treasure Island",cat:"Adventure",emoji:"🏝️",players:"Exploration"}
];
let category="All";
const games=document.getElementById("games");
const search=document.getElementById("search");
function render(){
 const q=search.value.toLowerCase();
 games.innerHTML="";
 data.filter(g=>(category==="All"||g.cat===category)
 &&g.name.toLowerCase().includes(q)).forEach(g=>{
 const card=document.createElement("article");
 card.className="card";
 const thumb=document.createElement("div");
 thumb.className="thumb";
 thumb.textContent=g.emoji;
 const info=document.createElement("div");
 info.className="info";
 const title=document.createElement("h3");
 title.textContent=g.name;
 const desc=document.createElement("p");
 desc.textContent=g.players+" · "+g.cat;
 const play=document.createElement("button");
 play.className="play";
 play.textContent="▶ Play";
 play.onclick=()=>{
 document.getElementById("message").textContent=
 g.name+" is a demo game card. No game server is connected yet.";
 };
 info.append(title,desc,play);
 card.append(thumb,info);
 games.append(card);
 });
}
function filterGames(cat){
 category=cat;
 render();
}
search.addEventListener("input",render);
render();
</script>
</body>
</html>
